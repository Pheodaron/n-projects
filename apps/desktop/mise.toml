[tools]
go = "latest"
node = "latest"
pnpm = "11.25.0"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = { version = "v3.0.0", install_env = { GOPROXY = "https://goproxy.io,direct" } }
protoc = "32.1"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.6"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.18.1"

[tasks.doctor]
run = "wails3 doctor"

[tasks.dev]
run = "wails3 dev"

[tasks.production]
run = "wails3 build"

[tasks."build:linux"]
run = "docker build --platform linux/amd64 --target linux-export --output type=local,dest=../../dist/linux-amd64 ."

[tasks."build:windows"]
run = "docker build --platform linux/amd64 --target windows-export --output type=local,dest=../../dist/windows-amd64 ."

[tasks.test]
run = "go test -race ./internal/..."

[tasks.vet]
run = "go vet ./internal/..."

[tasks.fmt]
run = "gofmt -w main.go internal frontend/embed.go"

[tasks.generate]
run = """
protoc \
    --proto_path=../../proto \
    --go_out=internal/gen \
    --go_opt=paths=source_relative \
    --go_opt="Mnprojects/v1/core.proto=github.com/Pheodaron/n-projects/apps/desktop/internal/gen/nprojects/v1;nprojectsv1" \
    --connect-go_out=internal/gen \
    --connect-go_opt=paths=source_relative \
    --connect-go_opt="Mnprojects/v1/core.proto=github.com/Pheodaron/n-projects/apps/desktop/internal/gen/nprojects/v1;nprojectsv1" nprojects/v1/core.proto
"""
