syntax = "proto3";

package agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "my-gitlab/ai-support/n-projects/proto/agent/v1;agentv1";

service AgentService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);
  rpc Send(SendRequest) returns (SendResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message CreateSessionRequest {}

message CreateSessionResponse {
  string session_id = 1;
}

message ListSessionsRequest {
  // Pages start at 1. A zero page_size selects the default of 50.
  int32 page = 1;
  int32 page_size = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message Session {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_activity_at = 4;
}

message RenameSessionRequest {
  string session_id = 1;
  string title = 2;
}

message RenameSessionResponse {}

message SendRequest {
  string session_id = 1;
  string text = 2;
  bool preempt = 3;
}

message SendResponse {}

message GetHistoryRequest {
  string session_id = 1;
}

message GetHistoryResponse {
  string session_id = 1;
  // Messages appear in storage order.
  repeated HistoryMessage messages = 2;
}

message HistoryMessage {
  string role = 1;
  string text = 2;
  repeated HistoryBlock blocks = 3;
  int64 id = 4;
  google.protobuf.Timestamp created_at = 5;
}

message HistoryBlock {
  // text, tool_call, or tool_result.
  string type = 1;
  string text = 2;
  // Original UTF-8 JSON payload, including call_id when supplied.
  bytes tool_json = 3;
}

message SubscribeRequest {
  string session_id = 1;
}

message Event {
  string session_id = 1;
  string type = 2;
  string agent_name = 3;
  string text = 4;
  // Same payload as HistoryBlock.tool_json.
  bytes tool_json = 5;
}
