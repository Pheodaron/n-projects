syntax = "proto3";

package nprojects.v1;

option go_package = "github.com/Pheodaron/n-projects/gen/go/nprojects/v1;nprojectsv1";

// SessionService manages the persisted conversation history.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
}

// RunService starts work independently of a transport connection.
service RunService {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // Each item replaces the previous snapshot. Closing the stream does not cancel the run.
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);
}

message Session {
  string id = 1;
  string title = 2;
  int64 created_at_unix_ms = 3;
  int64 updated_at_unix_ms = 4;
  string active_run_id = 5;
  string last_run_id = 6;
}

message Message {
  string id = 1;
  string session_id = 2;
  string run_id = 3;
  string role = 4;
  string content = 5;
  string status = 6;
  int64 seq = 7;
  int64 created_at_unix_ms = 8;
}

message Run {
  string id = 1;
  string session_id = 2;
  string status = 3;
  int64 revision = 4;
  bool context_truncated = 5;
  string error_code = 6;
  string error_message = 7;
  int64 created_at_unix_ms = 8;
  int64 updated_at_unix_ms = 9;
  Message message = 10;
}

message CreateSessionRequest {
  string request_id = 1;
  string title = 2;
}
message CreateSessionResponse { Session session = 1; }
message ListSessionsRequest {}
message ListSessionsResponse { repeated Session sessions = 1; }
message GetSessionRequest { string session_id = 1; }
message GetSessionResponse { Session session = 1; }
message UpdateSessionRequest {
  string session_id = 1;
  string request_id = 2;
  string title = 3;
}
message UpdateSessionResponse { Session session = 1; }
message DeleteSessionRequest {
  string session_id = 1;
  string request_id = 2;
}
message DeleteSessionResponse {}
message ListMessagesRequest { string session_id = 1; }
message ListMessagesResponse { repeated Message messages = 1; }

message StartRunRequest {
  string session_id = 1;
  string request_id = 2;
  string content = 3;
}
message StartRunResponse { Run run = 1; }
message GetRunRequest { string run_id = 1; }
message GetRunResponse { Run run = 1; }
message CancelRunRequest {
  string run_id = 1;
  string request_id = 2;
}
message CancelRunResponse { Run run = 1; }
message WatchRunRequest { string run_id = 1; }
message WatchRunResponse { Run run = 1; }
