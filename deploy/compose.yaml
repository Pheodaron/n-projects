services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: nprojects
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: nprojects
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nprojects"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres:
