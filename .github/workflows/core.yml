name: Core
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgres://nprojects:dev@127.0.0.1:5432/nprojects?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - uses: jdx/mise-action@v4
        with:
          version: '2026.11.3'
      - name: Verify generated RPC contract
        run: mise run generate && git diff --exit-code -- apps/desktop/internal/gen apps_back/server/internal/gen
      - name: Build backend image
        working-directory: apps_back/server
        run: mise trust && mise run build
      - name: Start PostgreSQL
        run: docker compose --env-file .env -f compose.yaml up -d --wait postgres
      - name: Apply migrations from project root
        run: mise run migrate
      - name: Start backend
        run: mise run compose:up
      - name: Verify container health
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/healthz
      - name: Test backend
        working-directory: apps_back/server
        run: mise run test && mise run vet
      - name: Test desktop bridge
        run: mise exec -- go -C apps/desktop test -race ./internal/... && mise exec -- go -C apps/desktop vet ./internal/...
      - name: Compose logs
        if: failure()
        run: docker compose --env-file .env -f compose.yaml logs
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env -f compose.yaml down --volumes

  desktop:
    name: Desktop binaries (${{ matrix.os }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    steps:
      - uses: actions/checkout@v5
      - name: Build desktop binary
        run: docker build --platform linux/amd64 --target ${{ matrix.os }}-export --output type=local,dest=dist/${{ matrix.os }}-amd64 apps/desktop
      - name: Inspect binary format
        run: file dist/${{ matrix.os }}-amd64/n-projects*
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}-amd64
          path: dist/${{ matrix.os }}-amd64/n-projects*
          if-no-files-found: error
