name: Core
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: nprojects
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: nprojects
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nprojects" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://nprojects:dev@127.0.0.1:5432/nprojects?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build
      - run: go test -race ./internal/...
      - run: go vet ./internal/... ./cmd/server
      - run: go build ./cmd/server && go build ./cmd/desktop
