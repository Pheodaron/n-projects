name: Core
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: nprojects
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: nprojects
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nprojects" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://nprojects:dev@127.0.0.1:5432/nprojects?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - uses: jdx/mise-action@v4
        with:
          version: '2026.11.3'
      - name: Verify generated RPC contract
        run: mise run proto:check
      - name: Apply Goose migrations
        run: mise run migrate
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - run: mise run build:frontend
      - run: mise run test
      - run: mise exec -- go vet ./internal/... ./cmd/server
      - run: mise run build
