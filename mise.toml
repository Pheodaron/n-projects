[tools]
go = "1.27.3"
protoc = "32.1"
"github:pressly/goose" = "3.24.3"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.6"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.18.1"

[env]
_.file = ".env"

[tasks.generate]
run = """
protoc \
    --proto_path=proto \
    --go_out=gen/go \
    --go_opt=paths=source_relative \
    --connect-go_out=gen/go \
    --connect-go_opt=paths=source_relative proto/nprojects/v1/core.proto
"""

[tasks."compose:up"]
run = "docker compose --env-file .env -f compose.yaml up -d --wait"

[tasks.test]
run = "go test -race ./... ./apps_back/server/... ./apps/desktop/internal/..."

[tasks.fmt]
run = "gofmt -w apps/desktop apps_back/server migrations"

[tasks.migrate]
env = { GOOSE_DRIVER = 'postgres', GOOSE_DBSTRING = '{{env.DATABASE_URL}}' }
run = 'goose -dir migrations up'

[tasks."migrate:down"]
env = { GOOSE_DRIVER = 'postgres', GOOSE_DBSTRING = '{{env.DATABASE_URL}}' }
run = 'goose -dir migrations down'

[tasks."migrate:status"]
env = { GOOSE_DRIVER = 'postgres', GOOSE_DBSTRING = '{{env.DATABASE_URL}}' }
run = 'goose -dir migrations status'
